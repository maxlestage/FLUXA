# Publie le site sur GitHub Pages à chaque push sur master qui le touche.
#
# Le site est une application Paquets (site/) : le workflow compile ses îlots en
# WebAssembly, puis demande au serveur d'écrire toutes ses pages en fichiers
# statiques, derrière le sous-chemin du dépôt (/FLUXA).
#
# Réglage à faire une fois : GitHub → Settings → Pages → Build and deployment →
# Source : « GitHub Actions ».
#
# Démarrage à la main : Actions → Deploy to GitHub Pages → Run workflow.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "heroku-build.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test the site
        working-directory: site
        run: cargo test --locked
      - name: Build the server and the islands
        run: ./heroku-build.sh
      - name: Export the static site
        working-directory: site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          ./target/release/fluxa-site export ../_site
          test -f ../_site/index.html
          test -f ../_site/pkg/fluxa_site_bg.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
