# Publie le dossier public/ sur GitHub Pages à chaque push sur master.
#
# Réglage à faire une fois : GitHub → Settings → Pages → Build and deployment →
# Source : « GitHub Actions ». Sans ce réglage, le workflow échoue à l'étape
# « Configure Pages ».
#
# Démarrage à la main : Actions → Deploy to GitHub Pages → Run workflow.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          cp -r public _site
          # Le site est statique : pas de Jekyll.
          touch _site/.nojekyll
          # Les pages utilisent des liens relatifs et fonctionnent sous /FLUXA/.
          # Seule 404.html, servie à n'importe quelle adresse, a des liens absolus :
          # ils reçoivent le chemin de base du site.
          sed -i -E "s#(href|src)=\"/#\1=\"${BASE_PATH}/#g" _site/404.html
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
