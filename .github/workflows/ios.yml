# L'app iOS, en Swift : la logique (FluxaCore) est testée sous Linux et macOS, puis
# l'app est compilée pour le simulateur, testée écran par écran (tests d'interface),
# et une capture de chaque écran est gardée.
#
# Aucune signature ici : la publication (TestFlight, App Store) demande un compte
# développeur Apple et se fait depuis Xcode.

name: iOS

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FluxaCore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: ios/FluxaCore
        run: swift test

  app:
    name: App (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project Fluxa.xcodeproj -scheme Fluxa -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot a simulator
        # Le premier démarrage d'un simulateur peut durer plusieurs minutes sur un runner.
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted((r for r in runtimes if 'iOS' in r), reverse=True):
              for device in runtimes[runtime]:
                  if device['name'].startswith('iPhone'):
                      print(runtime, device['name'], file=sys.stderr)
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('no iPhone simulator')
          ")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Test the app in the simulator
        working-directory: ios
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild \
            -project Fluxa.xcodeproj -scheme Fluxa -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build \
            test 2>&1 | tee test.log \
            | grep --line-buffered -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ test|\*\* TEST"
      - name: Take a screenshot of every screen
        if: always()
        working-directory: ios
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euxo pipefail
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Fluxa.app
          mkdir -p screenshots
          # Le tableau de bord, assez longtemps pour qu'une minute entre dans l'historique.
          xcrun simctl launch "$DEVICE" app.fluxa.ios
          sleep 75
          xcrun simctl io "$DEVICE" screenshot screenshots/1-tableau-de-bord.png
          shot() {
            xcrun simctl terminate "$DEVICE" app.fluxa.ios || true
            xcrun simctl launch "$DEVICE" app.fluxa.ios "$2" "$3"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "screenshots/$1.png"
          }
          shot 2-mon-reseau -fluxaScreen reseau
          shot 3-partage -fluxaTab partage
          shot 4-profils -fluxaTab profils
          shot 5-limiteur -fluxaScreen limiteur
          shot 6-historique -fluxaTab historique
          shot 7-reglages -fluxaTab reglages
          shot 8-diagnostic -fluxaScreen diagnostic
          shot 9-test-de-debit -fluxaScreen test
          shot 10-automatisations -fluxaScreen automatisations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore
