# L'app iOS : la logique (FluxaCore, en Swift) et le module de tentative d'application
# (Shaper, en Rust) sont testés sous Linux et macOS, puis l'app est compilée pour le
# simulateur, testée écran par écran (tests d'interface), et une capture de chaque écran
# est gardée.
#
# Aucune signature ici : l'envoi sur TestFlight se fait avec ios-release.yml.

name: iOS

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FluxaCore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Install SQLite's headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Test
        working-directory: ios/FluxaCore
        run: swift test
      - name: Test the Rust shaper
        working-directory: ios/Shaper
        run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings

  app:
    name: App (iOS simulator)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: .github/scripts/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust shaper (C ABI)
        working-directory: ios
        run: ./Shaper/build-xcframework.sh
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project Fluxa.xcodeproj -scheme Fluxa -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot a simulator
        # Le premier démarrage d'un simulateur peut durer plusieurs minutes sur un runner.
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          # Un iPhone ordinaire, à un écran (de préférence un modèle Pro), sur le plus récent
          # iOS : les modèles à deux écrans (« Duo », « Fold ») changent l'interface.
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          runtimes = json.load(sys.stdin)['devices']
          def rank(name):
              if re.fullmatch(r'iPhone \d+ Pro', name): return 0
              if re.fullmatch(r'iPhone \d+', name): return 1
              if re.search(r'Duo|Fold|Flip', name): return 9
              return 2
          for runtime in sorted((r for r in runtimes if 'SimRuntime.iOS-' in r), reverse=True):
              phones = [d for d in runtimes[runtime] if d['name'].startswith('iPhone') and rank(d['name']) < 9]
              if phones:
                  best = min(phones, key=lambda d: (rank(d['name']), d['name']))
                  print(runtime, best['name'], file=sys.stderr)
                  print(best['udid'])
                  sys.exit(0)
          sys.exit('no iPhone simulator')
          ")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Test the app in the simulator
        working-directory: ios
        timeout-minutes: 45
        run: |
          set -o pipefail
          xcodebuild \
            -project Fluxa.xcodeproj -scheme Fluxa -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build \
            test 2>&1 | tee test.log \
            | grep --line-buffered -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ test|\*\* TEST"
      - name: Take a screenshot of every screen
        if: always()
        working-directory: ios
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euxo pipefail
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Fluxa.app
          mkdir -p screenshots
          # Le tableau de bord, assez longtemps pour qu'une minute entre dans l'historique.
          xcrun simctl launch "$DEVICE" app.fluxa.ios -hasSeenWelcome YES
          sleep 75
          snap() {
            xcrun simctl io "$DEVICE" screenshot --display=internal "$1" 2>/dev/null \
              || xcrun simctl io "$DEVICE" screenshot "$1"
          }
          snap screenshots/1-tableau-de-bord.png
          shot() {
            xcrun simctl terminate "$DEVICE" app.fluxa.ios || true
            xcrun simctl launch "$DEVICE" app.fluxa.ios -hasSeenWelcome "${4:-YES}" "$2" "$3"
            sleep 6
            snap "screenshots/$1.png"
          }
          shot 2-mon-reseau -fluxaScreen reseau
          shot 3-partage -fluxaTab partage
          shot 4-profils -fluxaTab profils
          shot 5-limiteur -fluxaScreen limiteur
          shot 6-historique -fluxaTab historique
          shot 7-reglages -fluxaTab reglages
          shot 8-diagnostic -fluxaScreen diagnostic
          shot 9-test-de-debit -fluxaScreen test
          shot 10-automatisations -fluxaScreen automatisations
          shot 11-appareils -fluxaScreen appareils
          shot 12-forfait -fluxaScreen forfait
          shot 14-relais -fluxaScreen relais
          shot 15-widgets -fluxaScreen widgets
          shot 16-autorisations -fluxaScreen autorisations
          shot 13-accueil -fluxaTab reseau NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore
