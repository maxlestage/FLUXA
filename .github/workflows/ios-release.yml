# Envoie une version de l'app sur TestFlight. Démarrage à la main uniquement :
# Actions → iOS release → Run workflow.
#
# Avant le premier lancement :
#   1. créer l'app dans App Store Connect avec l'identifiant ci-dessous (le premier
#      lancement l'enregistre et dit quoi faire) ;
#   2. créer une clé d'API d'équipe App Store Connect (Utilisateurs et accès →
#      Intégrations → API App Store Connect), avec le rôle « Admin » : la signature
#      automatique crée le certificat de distribution, ce que les rôles plus restreints
#      ne permettent pas toujours à une clé ;
#   3. régler, dans GitHub → Settings → Secrets and variables → Actions :
#        - secret ASC_KEY_ID      l'identifiant de la clé
#        - secret ASC_ISSUER_ID   l'identifiant de l'émetteur
#        - secret ASC_KEY         le contenu du fichier .p8 (ASC_PRIVATE_KEY est aussi lu)
#
# L'identifiant de l'app est com.maxlestage.fluxa, ou la variable IOS_BUNDLE_ID si elle
# existe. Le workflow l'enregistre sur le compte développeur s'il ne l'est pas, et en tire
# l'identifiant de l'équipe (ou la variable APPLE_TEAM_ID). L'app elle-même se crée une
# fois à la main dans App Store Connect : l'API ne le permet pas.

name: iOS release

on:
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY || secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.maxlestage.fluxa' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the configuration
        run: |
          missing=""
          [ -n "${ASC_KEY_ID:-}" ] || missing="$missing ASC_KEY_ID"
          [ -n "${ASC_ISSUER_ID:-}" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "${ASC_PRIVATE_KEY:-}" ] || missing="$missing ASC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::TestFlight n'est pas configuré. Secrets manquants :$missing (voir l'en-tête de ce workflow)."
            exit 1
          fi
      - name: Prepare the key and find the app
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          export KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" ios/Config/appstoreconnect.py
      - name: Revoke the development certificates left by earlier runs
        # Chaque envoi en crée un (« Created via API ») : sans cela, la limite d'Apple
        # bloque la signature. Les certificats créés sur un Mac ne sont pas touchés.
        run: '"$RUNNER_TEMP/venv/bin/python" .github/release/revoke_ci_certificates.py'
      - name: Use the newest Xcode
        run: .github/scripts/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust shaper (C ABI)
        working-directory: ios
        run: ./Shaper/build-xcframework.sh
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          # Signature automatique de l'archive ; la signature de distribution se fait à
          # l'export. Le numéro de build suit celui du workflow.
          xcodebuild archive \
            -project Fluxa.xcodeproj -scheme Fluxa -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fluxa.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            FLUXA_BUNDLE_ID="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Sign for distribution and check the entitlements
        working-directory: ios
        run: |
          set -euo pipefail
          for destination in export upload; do
            cp Config/ExportOptions.plist "$RUNNER_TEMP/export-$destination.plist"
            /usr/libexec/PlistBuddy -c "Set :destination $destination" "$RUNNER_TEMP/export-$destination.plist"
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/export-$destination.plist"
          done
          export_archive() {
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Fluxa.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/export-$1.plist" \
              -exportPath "$RUNNER_TEMP/export-$1" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          # D'abord un export local, pour vérifier que l'app et ses extensions gardent
          # leurs droits une fois signées pour la distribution.
          export_archive export
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/export-export/*.ipa
          app=$(ls -d Payload/*.app)
          check() {
            codesign -d --entitlements - --xml "$1" 2>/dev/null > "$RUNNER_TEMP/entitlements.plist"
            for key in "${@:2}"; do
              grep -q "<key>$key</key>" "$RUNNER_TEMP/entitlements.plist" \
                || { echo "::error::$1 : droit $key absent après signature."; exit 1; }
            done
            echo "$1 : droits vérifiés (${*:2})."
          }
          check "$app" com.apple.developer.networking.networkextension keychain-access-groups
          check "$app/PlugIns/FluxaRelay.appex" com.apple.developer.networking.networkextension
          check "$app/PlugIns/FluxaWidgets.appex" keychain-access-groups
          cd - >/dev/null
          # Puis l'envoi sur TestFlight.
          export_archive upload
          echo "::notice::Build $GITHUB_RUN_NUMBER envoyé sur TestFlight pour $BUNDLE_ID. Apple le traite en 10 à 30 minutes."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/venv"
