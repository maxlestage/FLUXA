# Le projet Xcode de FLUXA, décrit pour XcodeGen : `xcodegen generate` écrit
# Fluxa.xcodeproj et App/Info.plist (aucun des deux n'est dans le dépôt).
name: Fluxa

options:
  bundleIdPrefix: app.fluxa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false

# L'identifiant de l'app et la signature viennent de Config/App.xcconfig, que complète
# un fichier local Config/Signing.local.xcconfig (voir ios/README.md).
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  # La logique de l'app, en Swift pur, testée à part (`swift test`).
  FluxaCore:
    path: FluxaCore

targets:
  Fluxa:
    type: application
    platform: iOS
    sources:
      - path: App
      # Le relevé partagé, l'activité en direct et les vues des widgets.
      - path: Shared
    dependencies:
      - package: FluxaCore
      # Le relais et la tentative d'application du plafond, en Rust, liés par leur ABI C
      # (construits par Shaper/build-xcframework.sh avant xcodegen).
      - framework: Shaper/FluxaShaper.xcframework
        embed: false
      # L'extension réseau qui garde le relais en service en arrière-plan.
      - target: FluxaRelay
      - sdk: NetworkExtension.framework
      # Les widgets et l'activité en direct du relais.
      - target: FluxaWidgets
    entitlements:
      path: App/Fluxa.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        # Le trousseau partagé avec les widgets, pour leur laisser le dernier relevé.
        keychain-access-groups:
          - $(AppIdentifierPrefix)fluxa.shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FLUXA
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # L'activité en direct du relais (écran verrouillé, Dynamic Island).
        NSSupportsLiveActivities: true
        FluxaKeychainGroup: $(AppIdentifierPrefix)fluxa.shared
        # Le relais de partage reçoit les connexions des appareils reliés à l'iPhone.
        NSLocalNetworkUsageDescription: FLUXA reçoit les connexions des appareils reliés à votre partage de connexion pour relayer, mesurer et plafonner leur trafic.
        # L'app n'utilise que le chiffrement du système (TLS).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID)
        PRODUCT_NAME: Fluxa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # L'extension de tunnel qui fait tourner le relais de partage en arrière-plan. Le tunnel
  # ne transporte aucun trafic de l'iPhone : il garde seulement le relais en service.
  FluxaRelay:
    type: app-extension
    platform: iOS
    sources:
      - path: RelayExtension
    dependencies:
      - framework: Shaper/FluxaShaper.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    info:
      path: RelayExtension/Info.plist
      properties:
        CFBundleDisplayName: Relais FLUXA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: RelayExtension/FluxaRelay.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).relay
        PRODUCT_NAME: FluxaRelay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # Les widgets (écran d'accueil, écran verrouillé) et l'activité en direct du relais. Ils
  # affichent le dernier relevé que l'app laisse dans le trousseau partagé.
  FluxaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Design/Format.swift
      - path: App/Design/Theme.swift
    dependencies:
      - package: FluxaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: FLUXA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FluxaKeychainGroup: $(AppIdentifierPrefix)fluxa.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FluxaWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)fluxa.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).widgets
        PRODUCT_NAME: FluxaWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # Les règles de l'interface : écriture des mesures, échelle du limiteur, interfaces.
  FluxaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Fluxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # L'app lancée et manipulée dans le simulateur, écran par écran.
  FluxaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Fluxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Fluxa

schemes:
  Fluxa:
    build:
      targets:
        Fluxa: all
        FluxaTests: [test]
        FluxaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxaTests
        - FluxaUITests
    archive:
      config: Release
