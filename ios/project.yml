# Le projet Xcode de FLUXA, décrit pour XcodeGen : `xcodegen generate` écrit
# Fluxa.xcodeproj et App/Info.plist (aucun des deux n'est dans le dépôt).
name: Fluxa

options:
  bundleIdPrefix: app.fluxa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false

# L'identifiant de l'app et la signature viennent de Config/App.xcconfig, que complète
# un fichier local Config/Signing.local.xcconfig (voir ios/README.md).
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  # La logique de l'app, en Swift pur, testée à part (`swift test`).
  FluxaCore:
    path: FluxaCore

targets:
  Fluxa:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FluxaCore
      # La tentative d'application du plafond, en Rust, liée par son ABI C
      # (construite par Shaper/build-xcframework.sh avant xcodegen).
      - framework: Shaper/FluxaShaper.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FLUXA
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # L'app n'utilise que le chiffrement du système (TLS).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID)
        PRODUCT_NAME: Fluxa
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Les règles de l'interface : écriture des mesures, échelle du limiteur, interfaces.
  FluxaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Fluxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # L'app lancée et manipulée dans le simulateur, écran par écran.
  FluxaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Fluxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLUXA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Fluxa

schemes:
  Fluxa:
    build:
      targets:
        Fluxa: all
        FluxaTests: [test]
        FluxaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxaTests
        - FluxaUITests
    archive:
      config: Release
