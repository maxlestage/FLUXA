# Le projet Xcode de FLUXA, décrit pour XcodeGen : `xcodegen generate` écrit
# Fluxa.xcodeproj et App/Info.plist (aucun des deux n'est dans le dépôt).
name: Fluxa

options:
  bundleIdPrefix: app.fluxa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  # La logique de l'app, en Swift pur, testée à part (`swift test`).
  FluxaCore:
    path: FluxaCore

targets:
  Fluxa:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FluxaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FLUXA
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # L'app n'utilise que le chiffrement du système (TLS).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Identifiant provisoire : à remplacer par celui du compte développeur.
        PRODUCT_BUNDLE_IDENTIFIER: app.fluxa.ios
        PRODUCT_NAME: Fluxa
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
