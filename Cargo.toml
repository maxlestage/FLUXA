# Moteur FLUXA : la logique de l'app, en Rust.
# Le site (site/) est une crate autonome avec son propre workspace.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["site"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
shared-types = { path = "crates/shared-types" }
capability-manager = { path = "crates/capability-manager" }
network-monitor = { path = "crates/network-monitor" }
bandwidth-manager = { path = "crates/bandwidth-manager" }
traffic-analytics = { path = "crates/traffic-analytics" }
persistence = { path = "crates/persistence" }
app-core = { path = "crates/app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Bibliothèque embarquée dans l'app : petite et sans symboles.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
